user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    # Proxied JSON is excluded: compressing authenticated responses that echo
    # tokens (admin CSRF) invites BREACH-style oracles.
    gzip_proxied off;
    gzip_types text/plain text/css application/javascript text/xml application/xml text/javascript;

    upstream backend       { server backend:8000;  keepalive 32; }
    upstream frontend      { server frontend:80;   keepalive 16; }
    upstream admin_frontend { server admin-frontend:80; keepalive 8; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=edge_api:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=edge_auth:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=edge_admin:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=edge_conn:10m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server {
        listen 80;
        server_name nerkhbaan.ir www.nerkhbaan.ir admin.nerkhbaan.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name nerkhbaan.ir www.nerkhbaan.ir;

        # Certbot stores the live files as symlinks into ../archive, so the whole
        # /etc/letsencrypt tree is mounted to keep those links resolvable.
        ssl_certificate     /etc/nginx/ssl/live/nerkhbaan.ir/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/nerkhbaan.ir/privkey.pem;

        client_max_body_size 1M;
        limit_conn edge_conn 64;

        # Admin API and metrics are not served on the public host.
        location ^~ /api/admin { return 404; }
        location ^~ /metrics   { return 404; }

        location = /api/ws/prices {
            include /etc/nginx/security-headers.inc;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Replace rather than append: $proxy_add_x_forwarded_for keeps the
            # caller-supplied head of the chain, which the backend cannot tell
            # apart from an address a real proxy wrote.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 70s;
            proxy_send_timeout 70s;
        }

        location ^~ /api/auth/ {
            include /etc/nginx/security-headers.inc;
            limit_req zone=edge_auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /api/ {
            include /etc/nginx/security-headers.inc;
            limit_req zone=edge_api burst=40 nodelay;
            limit_req_status 429;
            # No trailing slash keeps the /api/ prefix intact for backend routers
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 75s;
            proxy_connect_timeout 5s;
        }

        location / {
            include /etc/nginx/security-headers.inc;
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name admin.nerkhbaan.ir;

        ssl_certificate     /etc/nginx/ssl/live/admin.nerkhbaan.ir/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/admin.nerkhbaan.ir/privkey.pem;

        client_max_body_size 1M;
        limit_conn edge_conn 32;

        location /api/admin/ {
            include /etc/nginx/security-headers-admin.inc;
            limit_req zone=edge_admin burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 45s;
        }

        # Prometheus scraping stays inside the private network.
        location = /metrics {
            include /etc/nginx/security-headers-admin.inc;
            allow 127.0.0.1;
            allow 172.28.0.0/24;
            deny all;
            proxy_pass http://backend/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
        }

        location / {
            include /etc/nginx/security-headers-admin.inc;
            proxy_pass http://admin_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
