upstream nerkhbaan_shared_api {
    server nerkhbaan-backend:8000;
    keepalive 32;
}

upstream nerkhbaan_shared_web {
    server nerkhbaan-frontend:80;
    keepalive 16;
}

map $http_upgrade $nerkhbaan_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=nerkhbaan_shared_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=nerkhbaan_shared_auth_limit:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=nerkhbaan_shared_conn_limit:10m;

server {
    listen 80;
    server_name nerkhbaan.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/nerkhbaan-acme;
        default_type text/plain;
    }

    location / {
        return 308 https://nerkhbaan.ir$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name nerkhbaan.ir;

    ssl_certificate /etc/nginx/nerkhbaan-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/nerkhbaan-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NerkhbaanSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    limit_conn nerkhbaan_shared_conn_limit 64;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:; font-src 'self' data:; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests" always;

    location ^~ /api/admin { return 404; }
    location = /metrics { return 404; }

    location = /api/ws/prices {
        proxy_pass http://nerkhbaan_shared_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nerkhbaan_connection_upgrade;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
    }

    location ^~ /api/auth/ {
        limit_req zone=nerkhbaan_shared_auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://nerkhbaan_shared_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=nerkhbaan_shared_api_limit burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://nerkhbaan_shared_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://nerkhbaan_shared_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
