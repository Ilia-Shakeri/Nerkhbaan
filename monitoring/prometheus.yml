global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: nerkhbaan-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 8000
        refresh_interval: 15s
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
