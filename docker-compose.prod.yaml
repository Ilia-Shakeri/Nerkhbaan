services:
  redis:
    image: redis:7-alpine
    container_name: nerkhbaan-redis
    restart: unless-stopped
    # appendonly persists the price history/cache across restarts and rebuilds so
    # charts keep rendering immediately instead of waiting for a cold refresh.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - nerkhbaan-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: nerkhbaan-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - nerkhbaan-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nerkhbaan} -d ${POSTGRES_DB:-nerkhbaan}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Automated, scheduled database backups with built-in retention pruning.
  # Dumps land in the db_backups named volume so they survive container rebuilds.
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: nerkhbaan-db-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-nerkhbaan}
      POSTGRES_USER: ${POSTGRES_USER:-nerkhbaan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Daily at 03:00; keep 7 daily, 4 weekly, 6 monthly snapshots.
      SCHEDULE: "0 0 3 * * *"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nerkhbaan-network

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nerkhbaan-backend
    restart: unless-stopped
    env_file:
      - ./.env
    # Published on loopback only; the host nginx reverse-proxies to this port.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nerkhbaan-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  telegram-worker:
    build:
      context: ./apps/telegram_worker
      dockerfile: Dockerfile
    container_name: nerkhbaan-telegram-worker
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nerkhbaan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nerkhbaan}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nerkhbaan-network

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nerkhbaan-frontend
    restart: unless-stopped
    env_file:
      - .env
    # Published on loopback only; the host nginx reverse-proxies to this port.
    # Container serves the built site on port 80 internally.
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nerkhbaan-network

networks:
  nerkhbaan-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  db_backups:
