services:
  redis:
    image: redis:7-alpine
    container_name: nerkhbaan-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - nerkhbaan-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 160M

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: nerkhbaan-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/db/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=50
    networks:
      - nerkhbaan-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nerkhbaan} -d ${POSTGRES_DB:-nerkhbaan}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1536M

  # Automated, scheduled database backups with built-in retention pruning.
  # Dumps land in the db_backups named volume so they survive container rebuilds.
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: nerkhbaan-db-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-nerkhbaan}
      POSTGRES_USER: ${POSTGRES_USER:-nerkhbaan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Daily at 03:00; keep a small set for the 30 GB VPS disk.
      SCHEDULE: "0 0 3 * * *"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "2"
      BACKUP_KEEP_MONTHS: "2"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nerkhbaan-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nerkhbaan-backend
    restart: unless-stopped
    env_file:
      - ./.env
    # Published on loopback only; the host nginx reverse-proxies to this port.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nerkhbaan-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 640M

  telegram-worker:
    profiles:
      - telegram
    build:
      context: ./apps/telegram_worker
      dockerfile: Dockerfile
    container_name: nerkhbaan-telegram-worker
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nerkhbaan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nerkhbaan}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nerkhbaan-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nerkhbaan-frontend
    restart: unless-stopped
    env_file:
      - .env
    # Published on loopback only; the host nginx reverse-proxies to this port.
    # Container serves the built site on port 80 internally.
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nerkhbaan-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  nerkhbaan-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  db_backups:
