x-api-environment: &api-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nerkhbaan}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nerkhbaan}
  REDIS_URL: redis://redis:6379/0
  API_HOST: 0.0.0.0
  API_PORT: 8000
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,172.28.0.0/24}
  # Must match FORWARDED_ALLOW_IPS: both layers decide which hop may set
  # X-Forwarded-For, and a mismatch silently reintroduces IP spoofing.
  TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1,::1,172.28.0.0/24}
  ADMIN_TRUSTED_PROXY_IPS: ${ADMIN_TRUSTED_PROXY_IPS:-127.0.0.1,::1,172.28.0.0/24}

services:
  postgres:
    image: timescale/timescaledb:2.28.3-pg16
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nerkhbaan}
      POSTGRES_USER: ${POSTGRES_USER:-nerkhbaan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=60
    networks:
      - nerkhbaan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1536M

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    user: "999:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["sh", "/usr/local/bin/redis-safe-start.sh"]
    environment:
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-384mb}
    volumes:
      - redis_data:/data
      - ./scripts/redis-safe-start.sh:/usr/local/bin/redis-safe-start.sh:ro
    networks:
      - nerkhbaan-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M

  migrate:
    image: nerkhbaan-api:${APP_IMAGE_TAG:-local}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ./.env
    environment:
      <<: *api-environment
      MIGRATIONS_DIR: /app/db/migrations
    command: ["python", "-m", "app.migrations.runner"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nerkhbaan-network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  backend:
    image: nerkhbaan-api:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ./.env
    environment:
      <<: *api-environment
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - nerkhbaan-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=5).status == 200 else 1)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  frontend:
    image: nerkhbaan-web:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NPM_REGISTRY_PRIMARY: ${NPM_REGISTRY_PRIMARY:-https://package-mirror.liara.ir/repository/npm/}
        NPM_REGISTRY_SECONDARY: ${NPM_REGISTRY_SECONDARY:-https://mirror2.chabokan.net/npm/}
        NPM_REGISTRY_FALLBACK: ${NPM_REGISTRY_FALLBACK:-https://registry.npmjs.org/}
        # Baked at build time: the browser needs the public key to subscribe.
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nerkhbaan-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 160M

  admin-frontend:
    profiles: ["admin", "edge"]
    image: nerkhbaan-admin-web:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nerkhbaan-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 160M

  telegram-worker:
    profiles: ["telegram"]
    build:
      context: ./apps/telegram_worker
      dockerfile: Dockerfile
    image: nerkhbaan-telegram-worker:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nerkhbaan}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nerkhbaan}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - nerkhbaan-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # TLS termination, HSTS, edge rate limits and the admin vhost. Not started by
  # default because it needs certificates on the host:
  #   docker compose --profile edge up -d
  edge:
    profiles: ["edge"]
    image: nginx:1.30.4-alpine3.24
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.inc:/etc/nginx/security-headers.inc:ro
      - ./nginx/security-headers-admin.inc:/etc/nginx/security-headers-admin.inc:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/nginx/ssl:ro
      - ${CERTBOT_WEBROOT:-./certbot-webroot}:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      admin-frontend:
        condition: service_healthy
    networks:
      - nerkhbaan-network
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M

  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine-d257e5d
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-nerkhbaan}
      POSTGRES_USER: ${POSTGRES_USER:-nerkhbaan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SCHEDULE: "0 0 3 * * *"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "2"
      BACKUP_KEEP_MONTHS: "2"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - nerkhbaan-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.77.0
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks: [nerkhbaan-network]

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      redis-exporter:
        condition: service_started
    networks: [nerkhbaan-network]

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    user: "65534:65534"
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERTMANAGER_WEBHOOK_URL_FILE:?Set ALERTMANAGER_WEBHOOK_URL_FILE}:/run/secrets/alert_webhook_url:ro
      - alertmanager_data:/alertmanager
    networks: [nerkhbaan-network]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks: [nerkhbaan-network]

networks:
  nerkhbaan-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
  redis_data:
  db_backups:
  prometheus_data:
  alertmanager_data:
  grafana_data:
