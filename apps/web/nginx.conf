server {
    listen 80;
    server_name localhost;

    # Proxy all /api/* calls to the backend container
    location /api/ {
        # No trailing slash preserves the /api/ prefix so backend routers resolve correctly.
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 75s;
    }

    # SPA fallback
    location / {
        root       /usr/share/nginx/html;
        index      index.html index.htm;
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        root       /usr/share/nginx/html;
        expires    1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Static public files can change without a hashed name.
    location ~* \.(?:ico|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        root            /usr/share/nginx/html;
        expires         1h;
        access_log      off;
        add_header      Cache-Control "public, max-age=3600";
    }
}
