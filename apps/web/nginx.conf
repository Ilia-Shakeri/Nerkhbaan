map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=nerkhbaan_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=nerkhbaan_auth:10m rate=1r/s;

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The admin surface is only reachable through the dedicated admin host.
    location ^~ /api/admin {
        return 404;
    }

    # Prometheus output stays on the internal network.
    location ^~ /metrics {
        return 404;
    }

    location = /api/ws/prices {
        include            /etc/nginx/security-headers.inc;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Replace, never append: an appended chain lets the caller prepend a
        # forged address that the backend would otherwise treat as the client.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
    }

    location ^~ /api/auth/ {
        include            /etc/nginx/security-headers.inc;
        limit_req          zone=nerkhbaan_auth burst=10 nodelay;
        limit_req_status   429;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    # Proxy all remaining /api/* calls to the backend container.
    location /api/ {
        include            /etc/nginx/security-headers.inc;
        limit_req          zone=nerkhbaan_api burst=40 nodelay;
        limit_req_status   429;
        # No trailing slash preserves the /api/ prefix so backend routers resolve correctly.
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Keep-alive to the upstream; only the websocket location upgrades.
        proxy_set_header   Connection        "";
        proxy_read_timeout 75s;
        proxy_connect_timeout 5s;
    }

    location /assets/ {
        include    /etc/nginx/security-headers.inc;
        root       /usr/share/nginx/html;
        expires    1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /sw.js {
        include    /etc/nginx/security-headers.inc;
        root       /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location = /manifest.webmanifest {
        include    /etc/nginx/security-headers.inc;
        root       /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    # Static public files can change without a hashed name.
    location ~* \.(?:ico|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        include         /etc/nginx/security-headers.inc;
        root            /usr/share/nginx/html;
        expires         7d;
        access_log      off;
        add_header      Cache-Control "public, max-age=604800" always;
    }

    # SPA fallback
    location / {
        include    /etc/nginx/security-headers.inc;
        root       /usr/share/nginx/html;
        index      index.html index.htm;
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
