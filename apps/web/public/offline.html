<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nerkhbaan Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #c8f7ff;
        background: radial-gradient(circle at top, rgba(34, 211, 238, 0.22), transparent 48%), #020817;
      }

      .panel {
        width: min(90vw, 440px);
        border: 1px solid rgba(34, 211, 238, 0.4);
        background: rgba(8, 21, 44, 0.72);
        border-radius: 20px;
        padding: 28px;
        backdrop-filter: blur(12px);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
      }

      p {
        margin: 0;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <article class="panel">
      <h1>Offline Mode</h1>
      <p>Your connection dropped. Cached content stays available until the network is back.</p>
    </article>
  </body>
</html>
