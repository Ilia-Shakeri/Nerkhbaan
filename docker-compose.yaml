services:
  redis:
    image: redis:7-alpine
    container_name: nerkhbaan-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  frontend:
    image: nerkhbaan-frontend
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nerkhbaan-frontend
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./apps/api
    container_name: nerkhbaan-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://nerkhbaan:${POSTGRES_PASSWORD}@postgres:5432/nerkhbaan
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      REDIS_URL: redis://redis:6379/0
      ALANCHAND_API_TOKEN: ${ALANCHAND_API_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"

  postgres:
    image: postgres:16-alpine
    container_name: nerkhbaan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nerkhbaan
      POSTGRES_USER: nerkhbaan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nerkhbaan -d nerkhbaan']
      interval: 10s
      timeout: 5s
      retries: 5

  # CI/CD Services
  gitea:
    image: gitea/gitea:1.21.11
    container_name: nerkhbaan-gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__DOMAIN=git.nerkhbaan.ir
      - GITEA__server__SSH_DOMAIN=git.nerkhbaan.ir
      - GITEA__server__ROOT_URL=https://git.nerkhbaan.ir/
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:2222:22"
    volumes:
      - ./gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  gitea-runner:
    image: gitea/act_runner:nightly
    container_name: nerkhbaan-gitea-runner
    restart: unless-stopped
    depends_on:
      - gitea
    volumes:
      - ./gitea_runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      # The registration token will be added later from Gitea UI
      - GITEA_RUNNER_REGISTRATION_TOKEN=
      - GITEA_RUNNER_NAME=nerkhbaan-local-runner
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

volumes:
  postgres_data:
