version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: nerkhbaan-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://nerkhbaan:${POSTGRES_PASSWORD:-nerkhbaan}@postgres:5432/nerkhbaan
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ALANCHAND_API_TOKEN: ${ALANCHAND_API_TOKEN:-}
    # Map port 8000 to localhost to allow host Nginx to proxy it
    ports:
      - "127.0.0.1:8000:8000"

  postgres:
    image: postgres:16-alpine
    container_name: nerkhbaan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nerkhbaan
      POSTGRES_USER: nerkhbaan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nerkhbaan}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nerkhbaan -d nerkhbaan']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: