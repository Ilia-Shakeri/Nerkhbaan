services:
  frontend:
    image: nerkhbaan-frontend
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nerkhbaan-frontend
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./apps/api
    container_name: nerkhbaan-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://nerkhbaan:${POSTGRES_PASSWORD}@postgres:5432/nerkhbaan
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ALANCHAND_API_TOKEN: ${ALANCHAND_API_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
      
  postgres:
    image: postgres:16-alpine
    container_name: nerkhbaan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nerkhbaan
      POSTGRES_USER: nerkhbaan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nerkhbaan -d nerkhbaan']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: