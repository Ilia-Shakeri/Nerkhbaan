version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: nerkhban-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Use the internal docker network routing for the database
      DATABASE_URL: postgresql+psycopg://nerkhban:${POSTGRES_PASSWORD:-nerkhban}@postgres:5432/nerkhban
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ALANCHAND_API_TOKEN: ${ALANCHAND_API_TOKEN:-}
    # We do not expose ports to the host directly. Nginx handles this.
    expose:
      - "8000"

  proxy:
    image: nginx:alpine
    container_name: nerkhban-proxy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:16-alpine
    container_name: nerkhban-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nerkhban
      POSTGRES_USER: nerkhban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nerkhban}
    # SECURITY FIX: Bound strictly to localhost to prevent external brute-force attacks
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nerkhban -d nerkhban']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: