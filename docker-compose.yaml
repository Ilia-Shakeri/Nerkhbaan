x-api-environment: &api-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nerkhbaan}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nerkhbaan}
  REDIS_URL: redis://redis:6379/0
  API_HOST: 0.0.0.0
  API_PORT: 8000
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,172.28.0.0/24}

services:
  postgres:
    image: timescale/timescaledb:2.28.3-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nerkhbaan}
      POSTGRES_USER: ${POSTGRES_USER:-nerkhbaan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=1GB", "-c", "max_connections=60"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [nerkhbaan-network]

  redis:
    image: redis:7.2.15-alpine3.21
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        if [ -f /data/appendonly.aof.13.base.rdb ]; then
          if ! redis-check-rdb /data/appendonly.aof.13.base.rdb >/tmp/redis_aof_check.log 2>&1; then
            echo "Redis: unsupported/invalid AOF base file detected, clearing persisted AOF for fresh recovery."
            rm -f /data/appendonly.aof* /data/*.rdb
          fi
        fi

        exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [nerkhbaan-network]

  migrate:
    image: nerkhbaan-api:${APP_IMAGE_TAG:-local}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: "no"
    env_file: [./.env]
    environment:
      <<: *api-environment
      MIGRATIONS_DIR: /app/db/migrations
    command: ["python", "-m", "app.migrations.runner"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [nerkhbaan-network]

  backend:
    image: nerkhbaan-api:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file: [./.env]
    environment:
      <<: *api-environment
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=5).status == 200 else 1)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
    networks: [nerkhbaan-network]

  frontend:
    image: nerkhbaan-web:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NPM_REGISTRY_PRIMARY: ${NPM_REGISTRY_PRIMARY:-https://package-mirror.liara.ir/repository/npm/}
        NPM_REGISTRY_SECONDARY: ${NPM_REGISTRY_SECONDARY:-https://mirror2.chabokan.net/npm/}
        NPM_REGISTRY_FALLBACK: ${NPM_REGISTRY_FALLBACK:-https://registry.npmjs.org/}
    restart: unless-stopped
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [nerkhbaan-network]

  admin-frontend:
    profiles: [admin]
    image: nerkhbaan-admin-web:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:3001:80"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [nerkhbaan-network]

  telegram-worker:
    profiles: [telegram]
    image: nerkhbaan-telegram-worker:${APP_IMAGE_TAG:-local}
    build:
      context: ./apps/telegram_worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [./.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nerkhbaan}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nerkhbaan}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [nerkhbaan-network]

  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine-d257e5d
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-nerkhbaan}
      POSTGRES_USER: ${POSTGRES_USER:-nerkhbaan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SCHEDULE: "0 0 3 * * *"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "2"
      BACKUP_KEEP_MONTHS: "2"
    volumes:
      - db_backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [nerkhbaan-network]

networks:
  nerkhbaan-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
  redis_data:
  db_backups:
