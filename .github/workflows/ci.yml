name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.0"
  NPM_VERSION: "10.9.8"
  PYTHON_VERSION: "3.12.13"
  TRIVY_VERSION: "v0.70.0"
  TRIVY_IGNORE_FILE: ".github/security-exceptions/.trivyignore.yaml"

jobs:
  node-builds:
    name: Node lock and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund

      - name: Check Node.js and npm versions
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Install locked workspaces
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check lockfile stayed clean
        run: git diff --exit-code -- package-lock.json

      - name: Build web
        run: npm run build:web

      - name: Build admin
        run: npm run build:admin

      - name: Build desktop renderer
        run: npm run build:desktop

      - name: Run frontend contract tests
        run: npm run test:frontend

  python-unit:
    name: Python static and unit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/test
      JWT_SECRET_KEY: ci-unit-key-not-for-runtime-0000000000000000
      PRICING_REQUIRE_PROVIDER_KEYS: "false"
      REDIS_URL: ""
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check installed dependency set
        run: python -m pip check

      - name: Compile backend
        run: python -m compileall -q app tests scripts

      - name: Check Python names and imports
        run: python -m pyflakes app tests scripts

      - name: Run backend unit tests
        run: python -m unittest discover -s tests -v

  integration:
    name: Timescale, Redis, and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: timescale/timescaledb:2.28.3-pg16
        env:
          POSTGRES_DB: nerkhbaan_ci
          POSTGRES_USER: nerkhbaan
          POSTGRES_PASSWORD: ci-database-password
          TIMESCALEDB_TELEMETRY: "off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nerkhbaan -d nerkhbaan_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://nerkhbaan:ci-database-password@127.0.0.1:5432/nerkhbaan_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: ci-integration-key-not-for-runtime-000000000000
      MIGRATIONS_DIR: ${{ github.workspace }}/apps/api/db/migrations
      PRICING_REQUIRE_PROVIDER_KEYS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply migrations
        run: python -m app.migrations.runner

      - name: Prove migrations are idempotent
        run: python -m app.migrations.runner

      - name: Check migration state and checksums
        run: python tests/ci_migration_check.py

      - name: Smoke test Timescale and Redis
        run: python tests/ci_service_smoke.py

      - name: Prove refresh-token rotation under PostgreSQL race
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nerkhbaan:ci-database-password@127.0.0.1:5432/nerkhbaan_ci
        run: python -m unittest tests.test_auth_refresh_rotation.RefreshRotationPostgresTests -v

  compose:
    name: Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate development and production Compose files
        env:
          POSTGRES_PASSWORD: ci-compose-password
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose --profile admin --profile telegram -f docker-compose.yaml config --quiet
          docker compose --profile admin --profile telegram -f docker-compose.prod.yaml config --quiet

  repository-security:
    name: Repository security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test operator evidence verifier
        shell: pwsh
        run: ./scripts/test-operator-gates.ps1

      - name: Prove example evidence cannot pass
        shell: bash
        run: |
          if pwsh -File scripts/verify-operator-gates.ps1 -EvidencePath docs/operator-gates.evidence.example.json; then
            echo "Example evidence must not pass"
            exit 1
          fi

      - name: Scan tracked files for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          trivyignores: ${{ env.TRIVY_IGNORE_FILE }}

      - name: Scan dependency manifests for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          hide-progress: true
          trivyignores: ${{ env.TRIVY_IGNORE_FILE }}

  docker-images:
    name: Build and scan ${{ matrix.component }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
          - component: web
            context: .
            dockerfile: ./apps/web/Dockerfile
          - component: admin
            context: .
            dockerfile: ./apps/admin-web/Dockerfile
          - component: telegram
            context: ./apps/telegram_worker
            dockerfile: ./apps/telegram_worker/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: >-
          docker build
          --pull
          --file "${{ matrix.dockerfile }}"
          --tag "nerkhbaan-${{ matrix.component }}:${GITHUB_SHA}"
          "${{ matrix.context }}"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: nerkhbaan-${{ matrix.component }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          hide-progress: true
          trivyignores: ${{ env.TRIVY_IGNORE_FILE }}
