name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.0"
  NPM_VERSION: "10.9.8"
  PYTHON_VERSION: "3.12.13"
  TRIVY_VERSION: "v0.70.0"
  TRIVY_IGNORE_FILE: ".github/security-exceptions/.trivyignore.yaml"

jobs:
  node-builds:
    name: Node lock and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund

      - name: Check Node.js and npm versions
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Install locked workspaces
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check lockfile stayed clean
        run: git diff --exit-code -- package-lock.json

      - name: Build web
        run: npm run build:web

      - name: Build admin
        run: npm run build:admin

      - name: Build desktop renderer
        run: npm run build:desktop

      - name: Run frontend contract tests
        run: npm run test:frontend

  desktop-package:
    name: Desktop package
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspaces
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build unpacked desktop package
        run: npm run package:dir --workspace=nerkhbaan-desktop
      - name: Smoke test actual desktop package
        run: npm run test:desktop
      - name: Prove unsigned desktop fails publisher signature gate
        shell: pwsh
        run: |
          $gateOutput = powershell.exe -NoProfile -File scripts/verify-windows-signature.ps1 -ArtifactPath apps/desktop/release/win-unpacked/Nerkhbaan.exe -ExpectedPublisher 'CN=Unsigned CI fixture'
          $gateExit = $LASTEXITCODE
          $receipt = ($gateOutput -join "`n") | ConvertFrom-Json
          if ($gateExit -ne 1 -or $receipt.accepted -or $receipt.artifacts.Count -ne 1 -or $receipt.artifacts[0].signature_status -ne 'NotSigned') {
            throw 'Unsigned desktop must be rejected by the signature gate with a complete receipt.'
          }
          $global:LASTEXITCODE = 0

  go-sidecar:
    name: Feed pull Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test and build feed pull
        run: |
          docker run --rm -v "$PWD/apps/price-feed-pull:/src" -w /src golang:1.26.10-alpine3.24 sh -c 'apk add --no-cache git && go test ./... && CGO_ENABLED=0 go build -trimpath -o /tmp/price-feed-pull .'

  python-unit:
    name: Python static and unit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/test
      JWT_SECRET_KEY: ci-unit-key-not-for-runtime-0000000000000000
      PRICING_RIGHTS_ENFORCED: "false" # Legacy synthetic fixtures; strict source-rights tests enable it explicitly.
      PRICING_REQUIRE_PROVIDER_KEYS: "false"
      REDIS_URL: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
            apps/api/requirements.lock
            apps/api/requirements-dev.lock

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock

      - name: Check installed dependency set
        run: python -m pip check

      - name: Compile backend
        run: python -m compileall -q app tests scripts

      - name: Check Python names and imports
        run: python -m pyflakes app tests scripts

      - name: Test portable infrastructure contracts
        run: |
          python ../../scripts/test_infra_contracts.py
          python ../../scripts/test_browser_fixture.py
          python ../../scripts/test_load_test.py
          python ../../scripts/test_deploy_application.py
          python ../../scripts/test_deploy_normal_resume.py
          python ../../scripts/test_deploy_communications.py
          python ../../scripts/test_deploy_communications_recovery.py
          python ../../scripts/test_notification_delivery_probe.py
          python -m pyflakes ../../scripts/deploy_application.py ../../scripts/test_deploy_application.py ../../scripts/test_deploy_normal_resume.py
          python -m pyflakes ../../scripts/test_deploy_communications.py ../../scripts/deploy_communications_recovery.py ../../scripts/test_deploy_communications_recovery.py
          python -m pyflakes ../../scripts/notification_delivery_probe.py ../../scripts/test_notification_delivery_probe.py
          python ../telegram_worker/tests/test_source_rights.py -v
          python -m pyflakes ../telegram_worker/app/source_rights.py ../telegram_worker/app/worker.py ../telegram_worker/tests/test_source_rights.py

      - name: Run backend unit tests
        run: python -m unittest discover -s tests -v

      - name: Check generated API documentation
        run: |
          python ../../scripts/export_api_contracts.py
          git -C ../.. diff --exit-code -- docs/api-contracts.json docs/api-route-index.md

  integration:
    name: Timescale, Redis, and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: timescale/timescaledb:2.28.3-pg16
        env:
          POSTGRES_DB: nerkhbaan_ci
          POSTGRES_USER: nerkhbaan
          POSTGRES_PASSWORD: ci-database-password
          TIMESCALEDB_TELEMETRY: "off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nerkhbaan -d nerkhbaan_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      history-postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: nerkhbaan_history_ci
          POSTGRES_USER: nerkhbaan
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nerkhbaan -d nerkhbaan_history_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://nerkhbaan:ci-database-password@127.0.0.1:5432/nerkhbaan_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: ci-integration-key-not-for-runtime-000000000000
      PRICING_RIGHTS_ENFORCED: "false" # Legacy synthetic fixtures; production defaults to enforcement.
      MIGRATIONS_DIR: ${{ github.workspace }}/apps/api/db/migrations
      PRICING_REQUIRE_PROVIDER_KEYS: "false"
      PYTHONPATH: .
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.lock

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Apply migrations
        run: python -m app.migrations.runner

      - name: Prove migrations are idempotent
        run: python -m app.migrations.runner

      - name: Check migration state and checksums
        run: python tests/ci_migration_check.py

      - name: Smoke test Timescale and Redis
        run: python tests/ci_service_smoke.py

      - name: Prove multi-replica lease exclusion and handover
        run: python tests/ci_multi_replica_check.py

      - name: Prove shared source snapshots and URL quotas on owned Redis
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: python -m unittest tests.test_source_snapshots_redis tests.test_source_rights_policy.RightsPolicyTests -v

      - name: Prove refresh-token rotation under PostgreSQL race
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nerkhbaan:ci-database-password@127.0.0.1:5432/nerkhbaan_ci
        run: python -m unittest tests.test_auth_refresh_rotation.RefreshRotationPostgresTests -v

      - name: Prove notification sending state on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nerkhbaan:ci-database-password@127.0.0.1:5432/nerkhbaan_ci
        run: python -m unittest tests.test_alert_delivery_postgres.AlertDeliveryPostgresTests -v

      - name: Prove notification challenge races and mixed push outcomes
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nerkhbaan:ci-database-password@127.0.0.1:5433/nerkhbaan_history_ci
        run: python -m unittest tests.test_notification_otp_lifecycle tests.test_push_delivery_failures -v

      - name: Prove SMS and call controls, secrets, and paid-send races
        env:
          COMMUNICATIONS_TEST_DATABASE_URL: postgresql+psycopg://nerkhbaan:ci-database-password@127.0.0.1:5433/nerkhbaan_history_ci
        run: python -m unittest tests.test_admin_communications tests.test_communication_transports tests.test_communication_worker -v

      - name: Prove alert races and durable persistence queue safety
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nerkhbaan:ci-database-password@127.0.0.1:5433/nerkhbaan_history_ci
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: python -m unittest tests.test_step1_alert_consistency tests.test_step1_persistence_queue -v

      - name: Prove history aggregation on ordinary PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nerkhbaan:ci-database-password@127.0.0.1:5433/nerkhbaan_history_ci
          TEST_HISTORY_BACKEND: plain
        run: python -m unittest tests.test_history_backend_aggregation -v

      - name: Prove strict source permissions on ordinary PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nerkhbaan:ci-database-password@127.0.0.1:5433/nerkhbaan_history_ci
          PRICING_RIGHTS_ENFORCED: "true"
        run: python -m unittest tests.test_pricing_rights_postgres tests.test_nerkhsanj_history_postgres tests.test_servix_durable_backfill tests.test_reference_repository_postgres tests.test_latest_quote_availability -v

      - name: Prove strict source permissions with Timescale aggregates
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nerkhbaan:ci-database-password@127.0.0.1:5432/nerkhbaan_ci
          PRICING_RIGHTS_ENFORCED: "true"
        run: python -m unittest tests.test_pricing_rights_postgres tests.test_nerkhsanj_history_postgres tests.test_servix_durable_backfill tests.test_reference_repository_postgres tests.test_latest_quote_availability -v

      - name: Prove history aggregation on Timescale
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nerkhbaan:ci-database-password@127.0.0.1:5432/nerkhbaan_ci
          TEST_HISTORY_BACKEND: timescale
        run: python -m unittest tests.test_history_backend_aggregation -v

      - name: Prove browser fixture isolation and cleanup
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nerkhbaan:ci-database-password@127.0.0.1:5432/nerkhbaan_ci
        run: python ../../scripts/test_browser_fixture.py

      - name: Run route-level integration smoke
        env:
          BACKGROUND_TASKS_ENABLED: "false"
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/nerkhbaan-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat /tmp/nerkhbaan-api.log' EXIT
          python scripts/integration_smoke_test.py --base-url http://127.0.0.1:8000

      - name: Prove PostgreSQL backup restore
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: nerkhbaan
          PGPASSWORD: ci-database-password
          SOURCE_DATABASE: nerkhbaan_ci
          RESTORE_DATABASE: nerkhbaan_restore_ci
        run: bash ../../scripts/ci-restore-drill.sh

  compose:
    name: Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate development and production Compose files
        env:
          POSTGRES_PASSWORD: ci-compose-password
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
          ALERTMANAGER_WEBHOOK_URL_FILE: /tmp/ci-alert-webhook-url
          PRICING_WORKER_SHARED_SECRET: ci-worker-secret-not-for-runtime-000000000
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose --profile admin --profile telegram -f docker-compose.yaml config --quiet
          docker compose --profile admin --profile telegram --profile edge --profile monitoring -f docker-compose.prod.yaml config --quiet

      - name: Validate monitoring configurations
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/amtool -v "$PWD/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml

      - name: Validate nginx configurations
        run: |
          # The edge config is mounted at runtime, so a syntax error would only
          # surface on deploy. Check every proxy config against real nginx.
          # Generate disposable certificates on the runner: the runtime image
          # contains TLS libraries but need not include the openssl executable.
          fixture_tls="$(mktemp -d)"
          trap 'rm -rf -- "$fixture_tls"' EXIT
          for host in nerkhbaan.ir admin.nerkhbaan.ir; do
            mkdir -p "$fixture_tls/live/$host"
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$host" \
              -keyout "$fixture_tls/live/$host/privkey.pem" \
              -out "$fixture_tls/live/$host/fullchain.pem" >/dev/null 2>&1
          done
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --add-host frontend:127.0.0.1 \
            --add-host admin-frontend:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/security-headers.inc:/etc/nginx/security-headers.inc:ro" \
            -v "$PWD/nginx/security-headers-admin.inc:/etc/nginx/security-headers-admin.inc:ro" \
            -v "$fixture_tls:/etc/nginx/ssl:ro" \
            nginx:1.30.4-alpine3.24 nginx -t
          for app in web admin-web; do
            docker run --rm \
              --add-host backend:127.0.0.1 \
              -v "$PWD/apps/$app/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
              -v "$PWD/apps/$app/security-headers.conf:/etc/nginx/security-headers.inc:ro" \
              nginx:1.30.4-alpine3.24 nginx -t
          done

      - name: Validate relay configuration
        run: |
          relay_fixture_tls="$(mktemp -d)"
          trap 'rm -rf -- "$relay_fixture_tls"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=relay.example.com" \
            -keyout "$relay_fixture_tls/privkey.pem" \
            -out "$relay_fixture_tls/fullchain.pem" >/dev/null 2>&1
          # Syntax validation uses local fixture addresses; provider DNS and
          # reachability belong to the separate live canary checks.
          docker run --rm \
            --add-host api.gold-api.com:127.0.0.1 \
            -e CORE_IP_CIDR=203.0.113.10/32 \
            -e RELAY_SHARED_TOKEN=ci-relay-token-not-for-runtime-000000000000 \
            -e 'NGINX_ENVSUBST_FILTER=^(CORE_IP_CIDR|RELAY_SHARED_TOKEN)$' \
            -v "$PWD/infra/relay/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$relay_fixture_tls:/etc/nginx/tls:ro" \
            nginx:1.30.4-alpine3.24 nginx -t

  browser-e2e:
    name: Browser auth and alerts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: timescale/timescaledb:2.28.3-pg16
        env:
          POSTGRES_DB: nerkhbaan_e2e
          POSTGRES_USER: nerkhbaan
          POSTGRES_PASSWORD: ci-browser-password
          TIMESCALEDB_TELEMETRY: "off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nerkhbaan -d nerkhbaan_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://nerkhbaan:ci-browser-password@127.0.0.1:5432/nerkhbaan_e2e
      REDIS_URL: redis://127.0.0.1:6379/1
      JWT_SECRET_KEY: ci-browser-key-not-for-runtime-0000000000000000
      PRICING_RIGHTS_ENFORCED: "false" # Synthetic browser market fixtures have no provider licence.
      MIGRATIONS_DIR: ${{ github.workspace }}/apps/api/db/migrations
      PRICING_REQUIRE_PROVIDER_KEYS: "false"
      PYTHONPATH: .
      BACKGROUND_TASKS_ENABLED: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:4173
      PUBLIC_FRONTEND_ORIGIN: http://127.0.0.1:4173
      AUTH_COOKIE_SECURE: "false"
      TRUSTED_HOSTS: 127.0.0.1,localhost
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --disable-pip-version-check --require-hashes -r apps/api/requirements.lock
          npx playwright install --with-deps chromium
      - name: Apply migrations
        working-directory: apps/api
        run: python -m app.migrations.runner
      - name: Run browser test
        run: npm run test:e2e
      - name: Prove administrator SMS and call controls on desktop and mobile
        run: npx playwright test --config scripts/playwright-admin-panel.config.ts
      - name: Prove user alert SMS and call choices on desktop and mobile
        run: npx playwright test --config scripts/playwright-alert-communications.config.ts

  repository-security:
    name: Repository security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python audit runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit exact Python locks
        run: |
          python -m venv /tmp/nerkhbaan-audit-tools
          /tmp/nerkhbaan-audit-tools/bin/python -m pip install --disable-pip-version-check pip-audit==2.10.1
          /tmp/nerkhbaan-audit-tools/bin/python -m pip_audit --strict --disable-pip --require-hashes -r apps/api/requirements.lock
          /tmp/nerkhbaan-audit-tools/bin/python -m pip_audit --strict --disable-pip --require-hashes -r apps/telegram_worker/requirements.lock

      - name: Test operator evidence verifier
        shell: pwsh
        run: ./scripts/test-operator-gates.ps1

      - name: Test portable operator evidence verifier
        run: |
          python scripts/test_verify_operator_gates.py
          if python scripts/verify_operator_gates.py docs/operator-gates.evidence.example.json; then
            echo "Example evidence must not pass"
            exit 1
          fi

      - name: Prove example evidence cannot pass
        shell: bash
        run: |
          if pwsh -File scripts/verify-operator-gates.ps1 -EvidencePath docs/operator-gates.evidence.example.json; then
            echo "Example evidence must not pass"
            exit 1
          fi

      - name: Scan tracked files for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          trivyignores: ${{ env.TRIVY_IGNORE_FILE }}

      - name: Scan dependency manifests for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          hide-progress: true
          trivyignores: ${{ env.TRIVY_IGNORE_FILE }}

  docker-images:
    name: Build and scan ${{ matrix.component }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
          - component: web
            context: .
            dockerfile: ./apps/web/Dockerfile
          - component: admin
            context: .
            dockerfile: ./apps/admin-web/Dockerfile
          - component: telegram
            context: ./apps/telegram_worker
            dockerfile: ./apps/telegram_worker/Dockerfile
          - component: feed-pull
            context: ./apps/price-feed-pull
            dockerfile: ./apps/price-feed-pull/Dockerfile
          - component: relay
            context: ./infra/relay
            dockerfile: ./infra/relay/Dockerfile
          - component: edge
            context: ./nginx
            dockerfile: ./nginx/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: >-
          docker build
          --pull
          --file "${{ matrix.dockerfile }}"
          --build-arg VITE_VAPID_PUBLIC_KEY=ci-build-placeholder
          --tag "nerkhbaan-${{ matrix.component }}:${GITHUB_SHA}"
          "${{ matrix.context }}"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: nerkhbaan-${{ matrix.component }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          hide-progress: true
          trivyignores: ${{ env.TRIVY_IGNORE_FILE }}
