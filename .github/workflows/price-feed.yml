name: Public price feed

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/price-feed.yml
      - scripts/build-price-feed.py
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-price-feed
  cancel-in-progress: true

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build validated feed
        run: python3 scripts/build-price-feed.py /tmp/prices.json

      - name: Publish single-commit feed branch
        run: |
          git config user.name "Nerkhbaan Price Feed"
          git config user.email "price-feed@users.noreply.github.com"
          git switch --orphan price-feed-next
          git rm -rf .
          cp /tmp/prices.json prices.json
          git add prices.json
          git commit -m "data: refresh public price feed"
          git push --force origin HEAD:price-feed
