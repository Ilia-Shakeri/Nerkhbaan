name: Public price feed

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/price-feed.yml
      - scripts/build-price-feed.py
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-price-feed
  cancel-in-progress: true

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build validated feed
        run: python3 scripts/build-price-feed.py /tmp/prices.json

      - name: Publish validated feed branch
        run: |
          git config user.name "Nerkhbaan Price Feed"
          git config user.email "price-feed@users.noreply.github.com"
          previous="$(git ls-remote origin refs/heads/price-feed | cut -f1)"
          publish_dir="$(mktemp -d)"
          trap 'rm -rf -- "$publish_dir"' EXIT
          cp /tmp/prices.json "$publish_dir/prices.json"
          git -C "$publish_dir" init --initial-branch=price-feed
          # Preserve the ephemeral checkout credential without placing it in feed content.
          cp .git/config "$publish_dir/.git/config"
          git -C "$publish_dir" config user.name "Nerkhbaan Price Feed"
          git -C "$publish_dir" config user.email "price-feed@users.noreply.github.com"
          git -C "$publish_dir" add prices.json
          git -C "$publish_dir" commit -m "data: publish current validated feed"
          git -C "$publish_dir" push --force-with-lease="refs/heads/price-feed:$previous" origin HEAD:price-feed
