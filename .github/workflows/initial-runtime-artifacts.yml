name: Initial web runtime artifacts

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source commit on this workflow ref
        required: true
        type: string
      vapid_public_key:
        description: Existing public browser push key; never a private key
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: initial-runtime-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  runtime:
    name: Initial runtime ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./apps/api
            dockerfile: apps/api/Dockerfile
          - component: web
            context: .
            dockerfile: nginx/single/Dockerfile
          - component: feed
            context: apps/price-feed-pull
            dockerfile: apps/price-feed-pull/Dockerfile
          - component: postgres
            context: infra/initial-images
            dockerfile: infra/initial-images/postgres.Dockerfile
          - component: redis
            context: infra/initial-images
            dockerfile: infra/initial-images/redis.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify immutable source selection and public key
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLIC_KEY: ${{ inputs.vapid_public_key }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import hashlib, os, re
          assert re.fullmatch('[a-f0-9]{40}', os.environ['SOURCE_SHA'])
          assert hashlib.sha256(os.environ['PUBLIC_KEY'].encode()).hexdigest() == '0dc48003fa42c7f39424bb09461a9f872943fcc51a48fff61ae4e48ca417a2eb'
          PY
      - name: Build runtime on the runner
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLIC_KEY: ${{ inputs.vapid_public_key }}
          COMPONENT: ${{ matrix.component }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          docker build --pull --label "org.opencontainers.image.revision=$SOURCE_SHA" --build-arg "VITE_VAPID_PUBLIC_KEY=$PUBLIC_KEY" -f "$DOCKERFILE" -t "nerkhbaan-initial-$COMPONENT:$SOURCE_SHA" "$CONTEXT"
      - name: Scan the exact runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: nerkhbaan-initial-${{ matrix.component }}:${{ inputs.source_sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          hide-progress: true
          trivyignores: .github/security-exceptions/.trivyignore.yaml
          format: json
          output: runtime-scan.json
      - name: Export scanned image and bind its manifest
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          COMPONENT: ${{ matrix.component }}
        run: |
          mkdir output
          docker save -o output/runtime.tar "nerkhbaan-initial-$COMPONENT:$SOURCE_SHA"
          cp runtime-scan.json output/scan.json
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          component, source = os.environ['COMPONENT'], os.environ['SOURCE_SHA']
          ref = f'nerkhbaan-initial-{component}:{source}'
          info = json.loads(subprocess.check_output(['docker','image','inspect',ref]))[0]
          assert info['Config']['Labels']['org.opencontainers.image.revision'] == source
          files = {}
          for name in ['runtime.tar','scan.json']:
              path = pathlib.Path('output',name)
              with path.open('rb') as stream:
                  files[name] = {'sha256':hashlib.file_digest(stream,'sha256').hexdigest(),'bytes':path.stat().st_size}
          pathlib.Path('output/manifest.json').write_text(json.dumps({'component':component,'source_commit':source,'image_ref':ref,'image_id':info['Id'],'files':files},indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: initial-${{ matrix.component }}-${{ inputs.source_sha }}
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
